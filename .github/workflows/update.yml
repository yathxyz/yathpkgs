# Move each program to its newest release tag. scripts/update builds and checks
# the candidate before it replaces a pin, so main only ever holds pins that built.
# Runs on GitHub's own machines: this repository is public and nothing here
# needs access to the fleet.
name: Update pins

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-pins
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}
      - name: Update
        run: nix develop --command scripts/update --all | tee update.log
      - name: Commit
        run: |
          if git diff --quiet flake.nix flake.lock; then
            echo "nothing to update"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix flake.lock
          git commit -m "Update pins" -m "$(grep '→' update.log | grep -v unchanged)"
          git push
